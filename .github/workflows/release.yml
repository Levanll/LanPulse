name: Release

# 触发：推送 v* 标签（如 v1.0.0）
# 产物：安装包 + 绿色包，上传到对应的 GitHub Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0）"
        required: true

permissions:
  contents: write        # 创建 Release 与上传附件所必需

jobs:
  build:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 必须显式指定依赖文件路径。只写 cache: "pip" 时 setup-python 会去
          # 找 **/requirements.txt 或 **/pyproject.toml，两者都不存在时
          # 直接报错 "No file in ... matched to [**/requirements.txt ...]"
          # —— 这正是 v1.0.0 首次发布时该工作流失败的原因。
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          # 版本号唯一来源是 installer/LanPulse.iss 的 MyAppVersion，
          # 避免 tag 与脚本里的版本号漂移。
          #
          # 必须逐行跳过以 ';' 开头的注释行：iss 文件头部有一条用法示例
          #     ;      #define MyAppVersion "1.0.0"
          # 直接用 -match 对整个文件做正则，匹配到的是注释里那个 1.0.0，
          # 于是 Release 标题和绿色包名都成了 1.0.0（v1.2.0 发布时实际发生）。
          # 这里与 tools/check_consistency.py 的解析方式保持一致。
          $v = $null
          foreach ($line in Get-Content installer/LanPulse.iss) {
            if ($line.TrimStart().StartsWith(";")) { continue }
            if ($line -match '^\s*#define\s+MyAppVersion\s+"([^"]+)"') {
              $v = $Matches[1]
              break
            }
          }
          if (-not $v) { throw "无法从 installer/LanPulse.iss 解析 MyAppVersion" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      # 发布门禁。曾经把 pytest 与 audit_i18n 写在同一个 pwsh run 块里，
      # 问题在于 PowerShell 遇到非零退出的外部命令不会中断，runner 只采信
      # 整块最后一条命令的退出码 —— 也就是说 pytest 挂了、audit_i18n 通过，
      # 这一步仍显示成功，会直接把有问题的代码发出去。
      # 拆成独立 step 后由 runner 逐个校验退出码，任一失败即终止 job。
      - name: 运行测试
        env:
          PYTHONPATH: "."
        run: python -m pytest tests -q

      - name: 一致性检查
        env:
          PYTHONPATH: "."
          # runner 默认代码页是 cp1252，脚本内部已调 setup_console()，
          # 这里再显式指定一次，避免任何中文 print 把门禁本身弄崩。
          PYTHONIOENCODING: utf-8
        run: python tools/check_consistency.py

      - name: i18n 完整性
        env:
          PYTHONPATH: "."
          PYTHONIOENCODING: utf-8
        run: python tools/audit_i18n.py

      - name: 隐私核查
        env:
          PYTHONPATH: "."
          PYTHONIOENCODING: utf-8
        run: python tools/privacy_audit.py

      - name: 打包 exe
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包与绿色包
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          Write-Host "ISCC: $iscc"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          & $iscc "installer\LanPulse.iss"

          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "dist\LanPulse\*" `
            -DestinationPath "release\LanPulse-$v-win64-portable.zip" -Force

          # 每次构建都重新生成校验和。
          # 曾经踩过的坑：先由本地发布脚本上传了一份 SHA256SUMS.txt，
          # 之后 CI 重新构建并覆盖了安装包（大小都变了），但校验和文件
          # 因为是同名资产被跳过而保持旧内容 —— 用户下载后核对会失败。
          # 校验和必须与本次构建的产物同源，不能来自上一次构建。
          Write-Host "生成 SHA256SUMS.txt"
          $lines = Get-ChildItem release -File |
            Where-Object { $_.Name -notlike "SHA256SUMS*" } |
            Sort-Object Name |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$h  $($_.Name)"
            }
          $lines | Set-Content -Path "release\SHA256SUMS.txt" -Encoding ascii
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content "release\SHA256SUMS.txt"

          Get-ChildItem release | Select-Object Name, Length

      - name: 显示产物
        shell: pwsh
        run: |
          if (-not (Test-Path release)) { throw "release 目录不存在" }
          $files = Get-ChildItem release -File
          if ($files.Count -lt 2) { throw "产物不足 2 个，构建可能失败" }
          $files | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,2)}}

      - name: 上传到 Release
        # v2.6.2 是最后一个 v2 版本，已停止维护（Node 20 已废弃），
        # 官方要求升级到 v3（Node 24）。
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: LanPulse ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          # 覆盖同名资产（该参数默认就是 true，显式写出是为了表达意图）：
          # 重新发布时安装包与校验和必须来自同一次构建。
          # 曾经出现过「包是新的、SHA256SUMS 是旧的」不一致状态。
          overwrite_files: true
          files: |
            release/LanPulse-*-Setup.exe
            release/LanPulse-*-win64-portable.zip
            release/SHA256SUMS.txt
