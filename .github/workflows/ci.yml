name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次运行，避免队列堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # 只装测试需要的包。本项目的单元测试是纯逻辑测试：
        # 不开窗口、不需要管理员、不修改任何系统设置。
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pytest

      - name: Run tests
        # 必须设置 QT_QPA_PLATFORM=offscreen：
        # tests/ 导入 core 时不会碰 Qt，但 ci 若被扩展到导入 app.ui 模块，
        # 没有显示器的 runner 会在 QApplication 处直接失败。
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      # 下面三步是 HANDOFF 第八节"提交前必跑"里的发布门禁。
      # 拆成独立 step 而不是合并成一个 run 块：runner 的默认 shell 是
      # pwsh，多行 run 块里前一条命令失败不会让 PowerShell 中断，
      # 只有最后一条的退出码会被采信 —— 合并写法会静默放行失败的门禁。
      # 独立 step 由 runner 逐个检查退出码，任一失败即 job 失败。
      - name: Check consistency
        env:
          PYTHONPATH: "."
          # 脚本内部已调 tools/_console.py 的 setup_console()，
          # 这里再显式指定一次是双保险：runner 默认代码页是 cp1252，
          # 任何一处忘记 setup_console 的中文 print 都会让 step 直接崩。
          PYTHONIOENCODING: utf-8
        run: python tools/check_consistency.py

      - name: Audit i18n
        env:
          PYTHONPATH: "."
          PYTHONIOENCODING: utf-8
        run: python tools/audit_i18n.py

      - name: Privacy audit
        env:
          PYTHONPATH: "."
          PYTHONIOENCODING: utf-8
        run: python tools/privacy_audit.py

      - name: Byte-compile all sources
        # 等价于语法检查：任何 SyntaxError / 缩进错误在这里就会失败，
        # 不必等到打包阶段才发现。
        run: python -m compileall -q core app main.py
