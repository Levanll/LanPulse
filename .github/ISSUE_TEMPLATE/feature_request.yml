name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**你要解决的问题**，而不是直接说解决方案——
        同一个问题可能有更简单的做法。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true
        - label: 这个功能不会破坏"先备份后修改"的安全约束
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么困难？现有功能为什么不够用？
      placeholder: |
        例如：我经常在公司网和家里切换，每次换网络后 DNS 都被改回去，
        但我不知道什么时候变了。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 描述你期望的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如现在临时用别的方法绕过了，或者手动改注册表
      render: text

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 检测项（新增检测维度）
        - 修复动作（新增可执行操作）
        - 界面 / 交互
        - 国际化 / 翻译
        - 跨区域适配
        - 报告导出
        - 安装 / 打包
        - 其它

  - type: dropdown
    id: audience
    attributes:
      label: 这个功能主要给谁用
      options:
        - 普通用户（希望一键完成，不想理解细节）
        - 有一定基础的排障用户（愿意看诊断信息）
        - 运维 / IT 支持人员（需要批量或深度能力）
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: 是否涉及修改系统配置
      description: |
        如果涉及，请说明需要修改什么、如何备份、如何回滚。
        本项目的硬约束是：任何修改都必须可逆，且必须先备份。
      placeholder: |
        例如：需要写注册表 HKEY_LOCAL_MACHINE\...\Parameters 下的 XxxValue。
        备份方式：reg export 该键。回滚：reg import。
    validations:
      required: false
